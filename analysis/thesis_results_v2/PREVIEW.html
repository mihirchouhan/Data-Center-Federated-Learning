<figcaption>This describes the completed project workflow, not a command to rerun it. A target is always the next six observed ten-minute power bins. The historical and v5 panels have different accepted cohorts and protocols; their scores are not a controlled history-length comparison. Clients are compute nodes, not independent data centers. The v5 test origins occur on one already-observed evening.</figcaption></figure>

<figcaption>B denotes batch size and T history steps. Node identity occupies one stored channel; its eight embedding values replace that channel inside the model. a = sigma_x,power / sigma_y and b = (mu_x,power - mu_y) / sigma_y. baseline_coefficients is a fixed buffer. The zero-initialized head makes the initial candidate mathematically persistence, subject to recorded float32 rounding. This is the GRU used in the matched FedAvg/central-SGD studies; the historical LSTM shares the wrapper but uses an LSTM recurrent module. No model was instantiated to draw this diagram.</figcaption></figure>

<figcaption>This is the historical one-hour v1 comparison only. Its neural fits use Adam; XGBoost uses its own boosting settings. They are not the matched SGD/FedAvg control. XGBoost columns 0-77 are time-major numerical lags, with step 0 corresponding to 60 minutes before origin and step 5 to 10 minutes; node index 78 is categorical, not a continuous numerical magnitude or learned embedding. Weather masking zeroes temperature/humidity lag columns. Validation can retain the initial persistence candidate instead of a learned correction.</figcaption></figure>

<figcaption>The diagram shows algorithm structure within each separately frozen protocol. Historical v2/v3 clients process one full local training pass. V5 clients process m_k sampled native-pool examples, where m_k is their no-fill reference count, and aggregate by that processed count. SGD is lr 0.01, momentum 0 and weight decay 0; batch size is 512 with the partial batch retained. Client training is simulated on one compute process; parallel boxes indicate logical clients, not actual parallel execution or protected physical sites. Validation is scheduled only at the stated candidates; unscheduled rounds still commit. Equal nominal settings do not produce identical optimization trajectories.</figcaption></figure>

<figcaption>Forward filling uses only the same node/channel’s last original observation, resets at split cuts, never fills leading gaps, and does not renew age from an imputed value. Weather is never filled and is masked after standardization. Inputs may use causal prior-split history under that earlier split’s fill state; targets cannot cross their split boundary. Native training windows are 2310256 / 2996160 / 3459118 / 3867660 for no fill / FF10 / FF20 / FF30. All validation/test batches use the no-fill view even for models trained under filled policies. This tests training-pool access at fixed sample budgets, not accuracy on recovered filled evaluation windows.</figcaption></figure>

<figcaption>Pooled RMSE is the square root of count-weighted mean squared node RMSE, not the mean node RMSE. Missing nodes never receive zero error. Historical and v5 cohorts remain separate. Seeds are stochastic repeats on one dataset; sample SD is not a confidence interval and nodes/windows are not assumed independent datasets. The report uses already-saved predictions and performs no new inference.</figcaption></figure>
